<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendriers pompiers 2027</title>
<style>:root{font:16px system-ui;color:#173149;background:#eef3f7}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:16px}h1{font-size:1.65rem}section{background:white;padding:18px;margin:14px 0;border:1px solid #d4e0e9;border-radius:12px}button,input,select{font:inherit;padding:10px;min-height:44px;border:1px solid #a9bcc9;border-radius:7px}button{background:#18527b;color:white;cursor:pointer}button.secondary{background:#e3edf4;color:#123f62}nav,form{display:flex;align-items:end;flex-wrap:wrap;gap:10px}label{display:grid;gap:5px}input{max-width:100%}.note{background:#fff3df;border-radius:10px;padding:14px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.card{background:#ebf4fa;border-radius:8px;padding:14px}.card strong{display:block;font-size:1.5rem}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #d7e3ec;text-align:left}table button{min-height:36px}.denoms{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.denoms input{width:95px}small{color:#536a79}</style></head><body><main><h1>Calendriers pompiers 2027</h1><section><p class="note"><b>Mode sans compte.</b> Les données sont enregistrées dans ce navigateur, pas sur GitHub. Pas de synchronisation entre appareils. Effectuez régulièrement une sauvegarde JSON ; ne saisissez pas de données confidentielles sur un appareil partagé.</p><nav><button id="tourBtn">Tournées</button><button id="recapBtn">Comptabilité générale</button><button id="backupBtn" class="secondary">Sauvegarder JSON</button><label>Restaurer JSON<input id="restore" type="file" accept=".json,application/json"></label><button id="csvBtn" class="secondary">Exporter CSV (Excel)</button></nav><p id="message" role="status"></p></section><div id="view"></div></main>
<script>
(()=>{'use strict';
const key='calendriers-pompiers-local-v2',names=['lafeline','Cesset','marjorie stephane','pierre corentin','michael ambre sandra guillaume','alain guillaumeT anthony','caserne'],denoms=[50000,20000,10000,5000,2000,1000,500,200,100,50,20,10,5,2,1];
const empty=()=>({version:2,tours:Object.fromEntries(names.map(n=>[n,{sales:[],cash:{},cheques:[]}]))});
let data;try{data=JSON.parse(localStorage.getItem(key))||empty()}catch{data=empty()}
if(!data||!data.tours)data=empty();for(const n of names)if(!data.tours[n])data.tours[n]={sales:[],cash:{},cheques:[]};
let selected=names[0],mode='tour';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),eur=n=>(n/100).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}),num=s=>{let x=String(s??'').trim().replace(',','.');if(!/^\d+(\.\d{1,2})?$/.test(x))throw Error('Montant incorrect');return Math.round(Number(x)*100)},sum=a=>a.reduce((a,b)=>a+b,0),status=s=>$('#message').textContent=s,save=()=>{try{localStorage.setItem(key,JSON.stringify(data));return true}catch(e){status('Sauvegarde impossible : '+e.message);return false}},download=(content,name,type)=>{let b=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
function stat(t){let s=t.sales||[],v=sum(s.map(x=>x.amount)),cash=sum(s.map(x=>x.cash)),cheques=sum(s.map(x=>x.cheque)),counted=sum(denoms.map(d=>d*(Number(t.cash?.[d])||0))),countedChecks=sum((t.cheques||[]).map(x=>x.amount*x.qty));return{n:s.length,v,avg:s.length?v/s.length:null,cash,cheques,counted,countedChecks}}
function render(){let t=data.tours[selected],z=stat(t);if(mode==='recap'){let rows=names.map(n=>{let a=stat(data.tours[n]);return '<tr><td>'+esc(n)+'</td><td>'+a.n+'</td><td>'+eur(a.v)+'</td><td>'+(a.avg===null?'—':eur(a.avg))+'</td><td>'+eur(a.cash)+'</td><td>'+eur(a.cheques)+'</td></tr>'}).join('');let ss=names.map(n=>stat(data.tours[n])),v=sum(ss.map(x=>x.v)),count=sum(ss.map(x=>x.n));$('#view').innerHTML='<section><h2>Récapitulatif général</h2><div class="cards"><div class="card">Calendriers vendus<strong>'+count+'</strong></div><div class="card">Total<strong>'+eur(v)+'</strong></div><div class="card">Moyenne<strong>'+(count?eur(v/count):'—')+'</strong></div></div><div class="scroll"><table><tr><th>Tournée</th><th>Vendus</th><th>Total</th><th>Moyenne</th><th>Espèces</th><th>Chèques</th></tr>'+rows+'</table></div></section>';return}
$('#view').innerHTML='<section><label>Choisir la tournée<select id="route">'+names.map(n=>'<option '+(n===selected?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label><div class="cards"><div class="card">Vendus<strong>'+z.n+'</strong></div><div class="card">Montants reçus<strong>'+eur(z.v)+'</strong></div><div class="card">Moyenne<strong>'+(z.avg===null?'—':eur(z.avg))+'</strong></div></div><h2>Ajouter une vente</h2><form id="sale"><label>Nom<input name="name" maxlength="200" required></label><label>Montant (€)<input name="amount" inputmode="decimal" required></label><label>Paiement<select name="method"><option value="especes">Espèces</option><option value="cheque">Chèque</option><option value="mixte">Mixte</option><option value="autre">Autre</option></select></label><label>Espèces mixte (€)<input name="cash" placeholder="0,00"></label><label>Chèque mixte (€)<input name="cheque" placeholder="0,00"></label><button>Enregistrer</button></form><h2>Ventes</h2><div class="scroll"><table><tr><th>N°</th><th>Nom</th><th>Montant</th><th>Type</th><th></th></tr>'+(t.sales||[]).map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+eur(x.amount)+'</td><td>'+esc(x.method)+'</td><td><button data-remove="'+i+'">Supprimer</button></td></tr>').join('')+'</table></div></section><section><h2>Comptage espèces</h2><div class="denoms">'+denoms.map(d=>'<label>'+eur(d)+'<input data-denom="'+d+'" type="number" min="0" step="1" value="'+(t.cash?.[d]||0)+'"></label>').join('')+'</div><p>Déclarées '+eur(z.cash)+' ; comptées '+eur(z.counted)+' ; écart '+eur(z.cash-z.counted)+'</p><button id="saveCash">Enregistrer le comptage</button><h2>Comptage chèques</h2><form id="checkForm"><label>Montant unitaire (€)<input name="amount" required></label><label>Quantité<input type="number" min="1" value="1" name="qty" required></label><button>Ajouter</button></form><div class="scroll"><table><tr><th>Montant</th><th>Quantité</th><th>Total</th><th></th></tr>'+(t.cheques||[]).map((x,i)=>'<tr><td>'+eur(x.amount)+'</td><td>'+x.qty+'</td><td>'+eur(x.amount*x.qty)+'</td><td><button data-check-remove="'+i+'">Supprimer</button></td></tr>').join('')+'</table></div><p>Chèques déclarés '+eur(z.cheques)+' ; comptés '+eur(z.countedChecks)+' ; écart '+eur(z.cheques-z.countedChecks)+'</p><small>Les comptages ne sont pas ajoutés une deuxième fois aux recettes.</small></section>';
$('#route').onchange=e=>{selected=e.target.value;render()};
$('#sale').onsubmit=e=>{e.preventDefault();try{let f=new FormData(e.target),amount=num(f.get('amount')),method=f.get('method'),cash=0,cheque=0;if(method==='especes')cash=amount;else if(method==='cheque')cheque=amount;else if(method==='mixte'){cash=num(f.get('cash')||'0');cheque=num(f.get('cheque')||'0');if(cash+cheque!==amount)throw Error('Le mixte ne correspond pas au montant')};t.sales.push({name:String(f.get('name')).trim(),amount,method,cash,cheque});save();render()}catch(err){status(err.message)}};
document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer cette vente ?')){t.sales.splice(Number(b.dataset.remove),1);save();render()}});
$('#saveCash').onclick=()=>{let a={};for(let el of document.querySelectorAll('[data-denom]')){let q=Number(el.value);if(!Number.isSafeInteger(q)||q<0){status('Quantité incorrecte');return}a[el.dataset.denom]=q}t.cash=a;save();render()};
$('#checkForm').onsubmit=e=>{e.preventDefault();try{let f=new FormData(e.target),qty=Number(f.get('qty'));if(!Number.isSafeInteger(qty)||qty<1)throw Error('Quantité incorrecte');t.cheques.push({amount:num(f.get('amount')),qty});save();render()}catch(err){status(err.message)}};
document.querySelectorAll('[data-check-remove]').forEach(b=>b.onclick=()=>{t.cheques.splice(Number(b.dataset.checkRemove),1);save();render()});
}
$('#tourBtn').onclick=()=>{mode='tour';render()};$('#recapBtn').onclick=()=>{mode='recap';render()};$('#backupBtn').onclick=()=>download(JSON.stringify(data,null,2),'calendriers-pompiers-2027-sauvegarde.json','application/json');$('#restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d?.tours||!names.every(n=>d.tours[n]&&Array.isArray(d.tours[n].sales)))throw Error('Fichier JSON non compatible');if(!confirm('Remplacer les données locales par cette sauvegarde ?'))return;data=d;save();render();status('Sauvegarde restaurée')}catch(err){status('Import refusé : '+err.message)}};
$('#csvBtn').onclick=()=>{let rows=[['Tournée','Nom','Montant EUR','Paiement','Espèces EUR','Chèques EUR']];for(let n of names)for(let x of data.tours[n].sales)rows.push([n,x.name,(x.amount/100).toFixed(2),x.method,(x.cash/100).toFixed(2),(x.cheque/100).toFixed(2)]);let q=s=>{s=String(s??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'calendriers-pompiers-2027.csv','text/csv;charset=utf-8')};render();
})();
</script></body></html>
